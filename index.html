<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Parrilla - Carnicería Premium</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <nav class="nav-container">
            <div class="logo">
                <i class="fas fa-fire"></i>
                <h2>La Parrilla</h2>
            </div>
            <div class="hamburger">
                <span></span><span></span><span></span>
            </div>
            <ul class="nav-menu">
                <li><a href="#inicio">Inicio</a></li>
                <li><a href="#productos">Productos</a></li>
                <li><a href="#contacto">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <section id="inicio" class="hero">
        <div class="hero-content">
            <h1>La Mejor Carnicería de Bella Vista</h1>
            <p>Carnes premium frescas todos los días.</p>
            <div class="hero-buttons">
                <a href="#contacto" class="btn btn-primary">Pedir Ahora</a>
            </div>
        </div>
    </section>

    <section id="productos" class="productos">
        <div class="container">
            <h2>Nuestros Cortes</h2>
            <div class="productos-grid">
                <div class="producto-card">
                    <i class="fas fa-drumstick-bite"></i>
                    <h3>Asado Especial</h3>
                    <span class="precio">$3.800/kg</span>
                </div>
                <div class="producto-card">
                    <i class="fas fa-drumstick-bite"></i>
                    <h3>Bife de Chorizo</h3>
                    <span class="precio">$4.500/kg</span>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <p>© 2026 La Parrilla - Mayor Irusta, Bella Vista</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
